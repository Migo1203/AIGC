<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360"><rect width="1200" height="1360" fill="#f4f1eb"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="72" font-size="21" fill="#735f4b" font-weight="400">03 / BRAND STORY</text><text x="66" y="143" font-size="52" fill="#403a32" font-weight="700">品牌故事展示规划</text><text x="70" y="190" font-size="25" fill="#403a32" font-weight="400">单列长图 · 延续V04 · 规划V01待审阅</text><rect x="70" y="232" width="1060" height="183" rx="10" fill="#fffaf3" stroke="#d9cdbd"/><text x="104" y="283" font-size="34" fill="#403a32" font-weight="600">A  品牌氛围开场</text><text x="104" y="332" font-size="26" fill="#403a32" font-weight="400">一张完整空间图，先看见灯、家具与窗光。</text><text x="104" y="376" font-size="24" fill="#735f4b" font-weight="400">复用B00桌面背景，保留原比例。</text><text x="581" y="456" font-size="32" fill="#947856" font-weight="400">↓</text><rect x="70" y="478" width="1060" height="183" rx="10" fill="#fffaf3" stroke="#d9cdbd"/><text x="104" y="529" font-size="34" fill="#403a32" font-weight="600">B  桌面完整故事</text><text x="104" y="578" font-size="27" fill="#403a32" font-weight="400">品牌介绍 → 审美与造型 → 日常生活 → 品牌问答</text><text x="104" y="622" font-size="24" fill="#735f4b" font-weight="400">四张卡片与背景同场呈现，说明轮播关系。</text><text x="581" y="703" font-size="32" fill="#947856" font-weight="400">↓</text><rect x="70" y="725" width="1060" height="340" rx="10" fill="#fffaf3" stroke="#d9cdbd"/><text x="104" y="777" font-size="34" fill="#403a32" font-weight="600">C  手机四个状态，全数纵向展开</text><text x="104" y="834" font-size="27" fill="#403a32" font-weight="400">01  B01  品牌介绍：Logo与完整品牌介绍</text><text x="104" y="894" font-size="27" fill="#403a32" font-weight="400">02  B02  审美与造型：日光、轮廓与材质</text><text x="104" y="954" font-size="27" fill="#403a32" font-weight="400">03  B03  日常生活：夜间餐桌与暖光</text><text x="104" y="1014" font-size="27" fill="#403a32" font-weight="400">04  B04  品牌问答：三问三答全部展示</text><text x="70" y="1145" font-size="31" fill="#403a32" font-weight="600">正式制作重点</text><text x="70" y="1202" font-size="27" fill="#403a32" font-weight="400">高清Logo · 原生可编辑文字 · 底座暗边与比例复核</text><text x="70" y="1260" font-size="25" fill="#735f4b" font-weight="400">示意1600×7160；最终高度按重排调整。</text><text x="70" y="1307" font-size="23" fill="#735f4b" font-weight="400">本轮只做规划，不代表品牌故事V01已终审。</text></g></svg>