<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420"><rect width="1200" height="1420" fill="#f4f1eb"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="72" font-size="21" fill="#735f4b" font-weight="400">04 / BANNER SYSTEM</text><text x="66" y="143" font-size="52" fill="#403a32" font-weight="700">不同入口，同一种光</text><text x="70" y="193" font-size="26" fill="#403a32" font-weight="400">三主题 · 六份图片适配 · 单列长图规划V01</text><rect x="70" y="245" width="1060" height="195" rx="10" fill="#fffaf3" stroke="#d9cdbd"/><text x="104" y="300" font-size="34" fill="#403a32" font-weight="600">A  店铺页头：认识 Eric</text><text x="104" y="354" font-size="27" fill="#403a32" font-weight="400">品牌栏＋完整 Hero → 中央裁切检查</text><text x="104" y="399" font-size="28" fill="#735f4b" font-weight="400">Meet Eric.</text><text x="581" y="480" font-size="32" fill="#947856" font-weight="400">↓</text><rect x="70" y="502" width="1060" height="230" rx="10" fill="#fffaf3" stroke="#d9cdbd"/><text x="104" y="556" font-size="34" fill="#403a32" font-weight="600">B  餐桌导流：从场景进入产品</text><text x="104" y="610" font-size="27" fill="#403a32" font-weight="400">电脑大图 → 手机独立构图与相邻文字</text><text x="104" y="663" font-size="28" fill="#735f4b" font-weight="400">Set the table. Keep the glow.</text><text x="104" y="705" font-size="25" fill="#735f4b" font-weight="400">Explore Eric</text><text x="581" y="774" font-size="32" fill="#947856" font-weight="400">↓</text><rect x="70" y="797" width="1060" height="270" rx="10" fill="#fffaf3" stroke="#d9cdbd"/><text x="104" y="851" font-size="34" fill="#403a32" font-weight="600">C  REC 广告：同一利益，多种比例</text><text x="104" y="906" font-size="27" fill="#403a32" font-weight="400">横版图文关系 → 方版无字图 → 竖版无字图</text><text x="104" y="959" font-size="26" fill="#403a32" font-weight="400">三种比例完整下排，产品均可单独看清。</text><text x="104" y="1021" font-size="28" fill="#735f4b" font-weight="400">Evening light, without the cord.</text><text x="70" y="1141" font-size="31" fill="#403a32" font-weight="600">正式制作重点</text><text x="70" y="1199" font-size="27" fill="#403a32" font-weight="400">文字对比 · 底座与比例 · 独立Logo和字段</text><text x="70" y="1255" font-size="26" fill="#735f4b" font-weight="400">中央裁切是检查示意，不当作新增手机版。</text><text x="70" y="1302" font-size="26" fill="#735f4b" font-weight="400">V01／V02对比留到后续迭代段。</text><text x="70" y="1361" font-size="24" fill="#735f4b" font-weight="400">当前为规划，尚未制作正式04展示段。</text></g></svg>