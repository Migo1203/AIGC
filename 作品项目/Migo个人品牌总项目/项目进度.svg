<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-labelledby="progress-title progress-desc" lang="zh-CN" xml:lang="zh-CN" font-family="system-ui, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="progress-title">Migo 品牌设计与个人作品集网站进度</title>
