<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">小度随身音箱：美术语言与两张构图关系草案</title>
  <desc id="desc">清爽亲和的生活数码方向，包含建议色板、中文字体性格，以及便携动作与手机连接两张线框。仅为构图示意，不是产品效果图。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71866D" stroke-width="1.5"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24352F}.small{font-size:19px;fill:#606B64}.caption{font-size:22px}.label{font-size:20px;font-weight:700}.line{fill:none;stroke:#71866D;stroke-width:3}.ghost{fill:#F8F7F2;stroke:#87978A;stroke-width:2;stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1400" height="980" fill="#F3F1EA"/>
  <text x="44" y="66" font-size="38" font-weight="700">清爽亲和的生活数码</text>
  <text x="44" y="104" class="small">AI推荐 · 待用户评审 · 色值与字体均为本项目草案，非官方VI</text>
  <g transform="translate(44 140)">
    <text x="0" y="0" class="label">配色关系</text>
    <rect x="0" y="20" width="112" height="55" fill="#F3F1EA" stroke="#B8C0B7"/>
    <rect x="112" y="20" width="112" height="55" fill="#24352F"/>
    <rect x="224" y="20" width="112" height="55" fill="#91A58E"/>
    <rect x="336" y="20" width="112" height="55" fill="#DCE8EC"/>
    <rect x="448" y="20" width="112" height="55" fill="#D79D7C"/>
    <text x="0" y="104" font-size="17">#F3F1EA</text><text x="112" y="104" font-size="17">#24352F</text>
    <text x="224" y="104" font-size="17">#91A58E</text><text x="336" y="104" font-size="17">#DCE8EC</text><text x="448" y="104" font-size="17">#D79D7C</text>
    <text x="0" y="139" class="small">暖白承托、深色文字；生活图与功能图可换强调色。</text>
  </g>
  <g transform="translate(740 140)">
    <text x="0" y="0" class="label">字体性格与信息层级</text>
    <text x="0" y="55" font-size="36" font-weight="700">日常音乐，随手带走</text>
    <text x="0" y="96" font-size="24">约96g · 蓝牙连接手机播放</text>
    <text x="0" y="136" class="small">样张：Noto Sans CJK SC Regular / Bold</text>
    <text x="0" y="166" font-size="17" fill="#606B64">本机已安装；SVG在其他平台显示可能使用系统回退字库。</text>
  </g>
  <g transform="translate(44 347)">
    <text x="0" y="0" class="label">K01｜携带动作建立轻巧印象</text>
    <rect x="0" y="25" width="635" height="487" fill="#FFF" stroke="#BBC3BA"/>
    <text x="32" y="75" font-size="30" font-weight="700">日常音乐，随手带走</text>
    <text x="32" y="111" class="caption">约96g</text>
    <path d="M35 422 L595 422" stroke="#B8C6B5" stroke-width="2"/>
    <path d="M65 288 L239 288 L257 424 L48 424 Z" fill="#E8E3D7" stroke="#A7AA9C" stroke-width="2"/>
    <path d="M103 288 C101 238 199 238 200 288" fill="none" stroke="#A7AA9C" stroke-width="3"/>
    <text x="85" y="385" class="small">包口 / 承托</text>
    <rect x="295" y="215" width="168" height="117" rx="48" class="ghost"/>
    <text x="332" y="271" class="caption">产品位置</text>
    <text x="329" y="303" font-size="17" fill="#606B64">按实物比例</text>
    <path d="M545 159 C500 175 468 196 441 221" class="line" marker-end="url(#arrow)"/>
    <text x="370" y="145" class="small">手进入并拿起（待拍）</text>
    <path d="M228 280 C253 256 275 246 294 245" class="line" stroke-dasharray="5 6"/>
    <text x="33" y="470" class="small">动作 → 产品 → 次级重量信息；保留真实接触与阴影。</text>
    <text x="0" y="551" class="caption">素材缺口：小度手持 / 包口动作的可靠实拍参照。</text>
  </g>
  <g transform="translate(721 347)">
    <text x="0" y="0" class="label">K02｜连接关系解释手机音乐</text>
    <rect x="0" y="25" width="635" height="487" fill="#DCE8EC" stroke="#BBC3BA"/>
    <text x="32" y="75" font-size="29" font-weight="700">手机里的音乐，换个地方听</text>
    <text x="32" y="111" class="caption">蓝牙连接，手机播放</text>
    <rect x="71" y="197" width="106" height="182" rx="15" fill="#F9FAF9" stroke="#87978A" stroke-width="2"/>
    <path d="M110 213 L138 213" stroke="#87978A" stroke-width="3"/>
    <path d="M101 276 L101 300 M124 263 L124 313 M147 277 L147 300" stroke="#71866D" stroke-width="5"/>
    <text x="81" y="407" class="small">原创手机示意</text>
    <rect x="357" y="240" width="174" height="119" rx="48" class="ghost"/>
    <text x="391" y="293" class="caption">产品近景</text>
    <text x="385" y="325" font-size="17" fill="#606B64">与K01不同视角</text>
    <path d="M190 286 C240 225 297 225 341 276" class="line" marker-end="url(#arrow)"/>
    <text x="230" y="211" class="small">连接 / 音乐路径</text>
    <path d="M348 377 L551 377" stroke="#A3B4B5" stroke-width="2"/>
    <text x="33" y="470" class="small">手机 → 连接路径 → 音箱；助手使用条件另行分组。</text>
    <text x="0" y="551" class="caption">素材缺口：清楚的三分之四产品视角与原创图形。</text>
  </g>
  <text x="44" y="951" class="small">线框仅说明信息与空间关系；未生成效果图，未固定PS坐标，未宣告商业画面验证通过。</text>
</svg>
